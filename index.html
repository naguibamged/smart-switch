<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My home</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath fill='%23fff' transform='translate(4 4)' d='M12 3.2 3 10.2V20a1 1 0 0 0 1 1h5.2v-6.2h5.6V21H20a1 1 0 0 0 1-1v-9.8L12 3.2z'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath fill='%23fff' transform='translate(4 4)' d='M12 3.2 3 10.2V20a1 1 0 0 0 1 1h5.2v-6.2h5.6V21H20a1 1 0 0 0 1-1v-9.8L12 3.2z'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #000;
            --card: #1c1c1e;
            --card-2: #2a2a2e;
            --line: rgba(255, 255, 255, 0.08);
            --text: #f5f5f7;
            --muted: #8e8e93;
            --blue: #2f80ff;
            --blue-2: #1d65d8;
            --warm: #f5c451;
            --floor: #31443b;
            --floor-lit: #e0b15a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        button, input, select { font: inherit; color: inherit; }

        button {
            border: none;
            background: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 6px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .brand svg { display: block; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 0.75rem;
            background: var(--card);
            border-radius: 999px;
            padding: 6px 10px;
        }

        .status-pill.online { color: #b7f7c8; }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #666;
        }

        .status-pill.online .status-dot { background: #34c759; }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--card-2);
            display: grid;
            place-items: center;
            color: var(--text);
        }

        main {
            flex: 1;
            padding: 8px 16px 12px;
        }

        .hidden { display: none !important; }

        .chips {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border-radius: 999px;
            padding: 10px 14px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.92rem;
        }

        .chip.is-on { color: var(--text); }
        .chip.is-on.light { color: var(--warm); }

        .key-hint {
            width: 100%;
            text-align: left;
            background: #1a2744;
            color: #d6e6ff;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 0.9rem;
        }

        .room-card {
            background: var(--card);
            border-radius: 22px;
            overflow: hidden;
        }

        .room-head {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 16px 14px;
            text-align: left;
        }

        .room-copy { display: flex; flex-direction: column; align-items: flex-start; }

        .room-name { font-size: 1.05rem; font-weight: 700; }

        .room-sub {
            display: block;
            color: var(--muted);
            font-size: 0.82rem;
            margin-top: 3px;
        }

        .room-side {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brief-ico {
            display: none;
            width: 22px;
            height: 22px;
            color: var(--warm);
            place-items: center;
        }

        .brief-ico.show { display: grid; }
        #icon-fan.show { color: #d7ecff; }

        .chevron {
            width: 18px;
            height: 18px;
            color: var(--muted);
            transition: transform 0.2s ease;
        }

        .room-card.open .chevron { transform: rotate(180deg); }

        .room-body { display: none; padding: 0 10px 10px; }
        .room-card.open .room-body { display: block; }

        .device {
            background: #141416;
            border-radius: 16px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .device-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            text-align: left;
        }

        .d-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #2a2a2e;
            display: grid;
            place-items: center;
            color: var(--muted);
            flex: none;
        }

        .device-row.is-on .d-icon.light { color: var(--warm); background: #3a2e12; }
        .device-row.is-on .d-icon.fan { color: #d7ecff; background: #1a2836; }

        .d-copy { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
        .d-name { font-weight: 650; font-size: 0.98rem; }
        .d-state { color: var(--muted); font-size: 0.8rem; }
        .device-row.is-on .d-state { color: #9ec0ff; }

        .knob {
            width: 46px;
            height: 28px;
            border-radius: 99px;
            background: #3a3a3c;
            position: relative;
            flex: none;
        }

        .knob::after {
            content: "";
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.2s ease;
        }

        .device-row.is-on .knob { background: var(--blue); }
        .device-row.is-on .knob::after { transform: translateX(18px); }

        .timer-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 0 12px 12px 64px;
            color: var(--muted);
            font-size: 0.75rem;
        }

        .timer-input {
            width: 64px;
            background: #0c0c0e;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 8px;
        }

        .timer-btn {
            background: var(--card-2);
            border-radius: 8px;
            padding: 6px 8px;
            color: var(--text);
            font-size: 0.75rem;
        }

        .timer-left {
            margin-left: auto;
            color: #9ec0ff;
            min-height: 1em;
        }

        .map-head {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .seg {
            display: flex;
            background: var(--card);
            border-radius: 999px;
            padding: 3px;
        }

        .seg button {
            min-width: 46px;
            padding: 6px 12px;
            border-radius: 999px;
            color: var(--muted);
            font-weight: 700;
            font-size: 0.82rem;
        }

        .seg button.active {
            background: var(--card-2);
            color: white;
        }

        .plan {
            position: relative;
            background: #070708;
            border-radius: 18px;
            overflow: hidden;
        }

        .plan svg { width: 100%; height: auto; display: block; }

        .ghost-label { fill: #6a6a70; font-size: 11px; font-family: inherit; }
        .active-label { fill: #f2f2f4; font-size: 13px; font-weight: 700; font-family: inherit; }
        .wall { stroke: #5c5c62; stroke-width: 7; stroke-linecap: square; }
        .ghost-floor { fill: #1a1a1d; }
        .active-floor { fill: var(--floor); transition: fill 0.45s ease; }
        .room-glow { opacity: 0; transition: opacity 0.45s ease; }
        .lit .active-floor { fill: #6e5a34; }
        .lit .room-glow { opacity: 1; }

        .led-bar {
            position: absolute;
            z-index: 3;
            width: 42%;
            height: 14px;
            padding: 3px 4px;
            border: none;
            border-radius: 4px;
            background: linear-gradient(#3a3a3e, #161618);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 3px 8px rgba(0, 0, 0, 0.4);
            transform: translate(-50%, -50%);
            display: block;
        }

        .led-strip {
            display: block;
            height: 100%;
            border-radius: 2px;
            background: #3c3c40;
        }

        .led-bar.is-on {
            background: #141416;
            box-shadow: 0 -16px 28px rgba(255, 236, 190, 0.55), inset 0 0 0 1px rgba(255, 250, 240, 0.35);
        }

        .led-bar.is-on .led-strip {
            background: linear-gradient(#ffffff, #fff4d4);
            box-shadow: 0 0 8px #fff, 0 0 16px #ffe7b0;
        }

        .pin {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #111114;
            color: #8d8d93;
            display: grid;
            place-items: center;
            transform: translate(-50%, -50%);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        .pin.light-marker.is-on {
            color: var(--warm);
            background: #3a2e12;
            box-shadow: 0 0 18px rgba(245, 196, 81, 0.85);
        }

        .pin.fan-marker.is-on {
            color: #d7ecff;
            background: #1a2836;
        }

        .scene {
            height: 460px;
            display: grid;
            place-items: center;
            position: relative;
            background:
                radial-gradient(ellipse at 50% 62%, rgba(255, 255, 255, 0.05), transparent 55%),
                #070708;
            border-radius: 18px;
            overflow: hidden;
        }

        .house {
            width: 300px;
            height: 230px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-42deg);
        }

        .slab {
            position: absolute;
            background: #242428;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .room {
            position: absolute;
            left: 0;
            top: 84px;
            width: 176px;
            height: 140px;
            transform-style: preserve-3d;
        }

        .floor {
            position: absolute;
            inset: 0;
            background: #3d4a43;
            transition: background 0.45s ease, box-shadow 0.45s ease;
        }

        .lit .floor {
            background: linear-gradient(to top, #fff6df 0%, #f0c56e 20%, #c9843a 58%, #8d6a38 100%);
            box-shadow: 0 0 24px rgba(255, 214, 140, 0.7);
        }

        .glow {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(255, 252, 245, 0.95) 0%, rgba(255, 220, 150, 0.38) 26%, transparent 72%);
            opacity: 0;
            transition: opacity 0.45s ease;
            pointer-events: none;
        }

        .room .led-bar {
            width: 78%;
            height: 10px;
            left: 50%;
            top: auto;
            bottom: 0;
            transform: translate(-50%, 45%);
        }

        .lit .glow { opacity: 1; }

        .wall {
            position: absolute;
            background: linear-gradient(#f7f7f8, #d5d5da);
        }

        .wall.back {
            left: 0;
            top: 0;
            width: 100%;
            height: 58px;
            transform-origin: top center;
            transform: rotateX(-90deg);
        }

        .wall.side {
            left: 0;
            top: 0;
            width: 58px;
            height: 100%;
            transform-origin: left center;
            transform: rotateY(90deg);
            background: linear-gradient(#eeeef2, #c4c4ca);
        }

        .window {
            position: absolute;
            left: 22px;
            right: 22px;
            top: 16px;
            height: 20px;
            border-radius: 2px;
            background: #8ec8ee;
            opacity: 0.35;
        }

        .lit .window { background: #fff1c2; opacity: 0.9; }

        .billboard {
            position: absolute;
            transform: rotateZ(42deg) rotateX(-60deg) translate(-50%, -50%) translateZ(36px);
            transform-style: preserve-3d;
        }

        .scene-caption {
            position: absolute;
            left: 16px;
            top: 14px;
            z-index: 3;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .bulb, .fan-unit, .fan-svg { width: 22px; height: 22px; }
        .pin .bulb, .pin .fan-unit, .d-icon .bulb, .d-icon .fan-unit { width: 22px; height: 22px; }
        .brief-ico.fan-unit { display: none; }
        .brief-ico.fan-unit.show { display: block; }
        .pin.fan-unit { display: grid; }

        .fan-unit { position: relative; }
        .blades { position: absolute; inset: 0; }
        .blades i {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 7px;
            height: 10px;
            margin-left: -3.5px;
            margin-top: -10px;
            background: currentColor;
            border-radius: 8px 8px 2px 2px;
            transform-origin: 50% 10px;
        }
        .blades i:nth-child(2) { transform: rotate(120deg); }
        .blades i:nth-child(3) { transform: rotate(240deg); }
        .hub {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: currentColor;
        }

        .fan-svg.spin,
        .spin .fan-svg { animation: spin 0.85s linear infinite; transform-origin: 50% 50%; }
        .spin .blades { animation: spin 0.85s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .spin .blades { animation: none; }
        }

        .tabbar {
            display: flex;
            gap: 4px;
            margin: 0 16px 14px;
            background: #2a2a2e;
            border-radius: 28px;
            padding: 6px;
        }

        .tabbar button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #9a9aa1;
            border-radius: 22px;
            padding: 8px 0 7px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .tabbar button.active {
            background: #3a3a40;
            color: white;
        }

        .scrim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 20;
        }

        .sheet {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: min(440px, 100%);
            max-height: min(78vh, 640px);
            overflow: auto;
            background: #161618;
            border-radius: 22px 22px 0 0;
            padding: 12px 16px 24px;
            z-index: 21;
        }

        .sheet-grab {
            width: 42px;
            height: 4px;
            border-radius: 99px;
            background: #3a3a3e;
            margin: 0 auto 12px;
        }

        .sheet h2 { font-size: 1.05rem; margin-bottom: 8px; }

        .note {
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .field { margin-bottom: 12px; }

        .field label, .touch-row span {
            display: block;
            font-size: 0.82rem;
            margin-bottom: 6px;
        }

        .key-input, .touch-select {
            width: 100%;
            background: #0c0c0e;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .touch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid var(--line);
        }

        .touch-row .meta { color: var(--muted); font-size: 0.75rem; }
        .touch-row .touch-select { width: auto; min-width: 140px; }

        .sheet-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

        .preset-buttons { display: contents; }

        .preset-block {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .preset-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .preset-head button:disabled { opacity: 0.4; }

        .preset-edit {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .preset-edit input {
            width: 88px;
            background: #0c0c0e;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .preset-edit span { color: var(--muted); font-size: 0.8rem; }

        .btn-blue, .btn-quiet {
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
        }

        .btn-blue { background: var(--blue); color: white; }
        .btn-blue:active { background: var(--blue-2); }
        .btn-quiet { background: var(--card-2); }

        .log-box {
            margin-top: 16px;
            max-height: 120px;
            overflow: auto;
            font-size: 0.72rem;
            color: var(--muted);
            font-family: ui-monospace, monospace;
        }

        .log-entry { padding: 2px 0; }
        .log-entry.success { color: #86efac; }
        .log-entry.error { color: #fca5a5; }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="brand">
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 3.2 3 10.2V20a1 1 0 0 0 1 1h5.2v-6.2h5.6V21H20a1 1 0 0 0 1-1v-9.8L12 3.2z"/>
            </svg>
            My home
        </div>
        <div class="header-actions">
            <div class="status-pill" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Connecting...</span>
            </div>
            <button class="icon-btn" type="button" onclick="openSettings()" aria-label="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="5" r="1.7" fill="currentColor"/>
                    <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
                    <circle cx="12" cy="19" r="1.7" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <section id="dashboardView">
            <div class="chips">
                <div class="chip light" id="chip-lights">
                    <svg class="bulb" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M12 2a7 7 0 0 0-4 12.7c.4.5.8 1.1.9 1.8h6.2c.1-.7.5-1.3.9-1.8A7 7 0 0 0 12 2z"/>
                        <path fill="currentColor" d="M9 18.5h6v1.2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V18.5z"/>
                    </svg>
                    <span id="chip-lights-text">0 on</span>
                </div>
                <div class="chip" id="chip-fan">
                    <svg class="fan-svg" viewBox="0 0 24 24" aria-hidden="true">
                        <ellipse cx="12" cy="5.5" rx="2.15" ry="4" fill="currentColor"/>
                        <ellipse cx="12" cy="5.5" rx="2.15" ry="4" fill="currentColor" transform="rotate(90 12 12)"/>
                        <ellipse cx="12" cy="5.5" rx="2.15" ry="4" fill="currentColor" transform="rotate(180 12 12)"/>
                        <ellipse cx="12" cy="5.5" rx="2.15" ry="4" fill="currentColor" transform="rotate(270 12 12)"/>
                        <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
                    </svg>
                    <span id="chip-fan-text">Off</span>
                </div>
            </div>

            <button id="keyHint" class="key-hint hidden" type="button" onclick="openSettings()">Add your AIO key to connect this home.</button>

            <article class="room-card" id="roomCard">
                <button class="room-head" type="button" onclick="toggleRoom()" aria-expanded="false" id="roomToggle">
                    <span class="room-copy">
                        <span class="room-name">Room</span>
                        <span class="room-sub" id="roomBrief">All off</span>
                    </span>
                    <span class="room-side">
                        <span id="icon-lights" class="brief-ico" data-light>
                            <svg class="bulb" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="currentColor" d="M12 2a7 7 0 0 0-4 12.7c.4.5.8 1.1.9 1.8h6.2c.1-.7.5-1.3.9-1.8A7 7 0 0 0 12 2z"/>
                                <path fill="currentColor" d="M9 18.5h6v1.2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V18.5z"/>
                            </svg>
                        </span>
                        <svg id="icon-fan" class="brief-ico fan-svg" data-fan data-fan-rotor viewBox="0 0 24 24" aria-hidden="true">
                            <ellipse cx="12" cy="5.5" rx="2.15" ry="4" fill="currentColor"/>
                        <ellipse cx="12" cy="5.5" rx="2.15" ry="4" fill="currentColor" transform="rotate(90 12 12)"/>
                        <ellipse cx="12" cy="5.5" rx="2.15" ry="4" fill="currentColor" transform="rotate(180 12 12)"/>
                        <ellipse cx="12" cy="5.5" rx="2.15" ry="4" fill="currentColor" transform="rotate(270 12 12)"/>
                            <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
                        </svg>
                        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M7 10l5 5 5-5H7z"/>
                        </svg>
                    </span>
                </button>
                <div class="room-body" id="roomBody">
                    <div class="device">
                        <button class="device-row" id="row-r1" type="button" onclick="toggleRelay('r1')" aria-pressed="false">
                            <span class="d-icon light" data-light>

                <option value="1">Lights</option>
                <option value="2">Ceiling fan</option>
            </select>
        </div>

            <div>
                <span>Touch 2</span>
                <div class="meta">GPIO 7</div>
            </div>
            <select id="touch-map-1" class="touch-select" onchange="onTouchSelectChange()">
                <option value="0">Off</option>
                <option value="1">Lights</option>

            <button class="btn-blue" type="button" onclick="saveAioKey()">Save key</button>
            <button class="btn-blue" type="button" onclick="saveTouchSettings()">Save touch</button>

<script>
    const USERNAME = "naguibamged";
    const FEED_KEY = "control1";
    const AIO_STORAGE_KEY = "aioKey";
    const VIEW_STORAGE_KEY = "homeView";
    const PRESET_STORAGE_KEY = "timerPresets";
    const DEFAULT_PRESETS = [1800, 3600, 28800];
    const MAX_PRESETS = 6;
    const MAX_PRESET_MINUTES = 1440;
    const DEVICES = ["r1", "r2"];

    let AIO_KEY = localStorage.getItem(AIO_STORAGE_KEY) || "";
    let keyMissingLogged = false;

    const RELAYS = ["r1", "r2", "r3", "r4"];
    const MAX_TIMER_SECONDS = 86400;

    let currentStates = { r1: 0, r2: 0, r3: 0, r4: 0 };
    let deadlines = { r1: 0, r2: 0, r3: 0, r4: 0 };
    let lastAppliedId = null;
    let touchMap = [0, 0];
    let settingsDirty = false;
    let fillingTouch = false;
    let timerPresets = {
        r1: DEFAULT_PRESETS.slice(),
        r2: DEFAULT_PRESETS.slice()
    };

    function presetList(value) {
        if (!Array.isArray(value)) return null;
        const next = value
            .map((seconds) => Math.floor(Number(seconds)))
            .filter((seconds) => seconds >= 60 && seconds <= MAX_TIMER_SECONDS)
            .map((seconds) => Math.floor(seconds / 60) * 60)
            .slice(0, MAX_PRESETS);
        return next.length ? next : null;
    }

    function loadPresets() {
        try {
            const parsed = JSON.parse(localStorage.getItem(PRESET_STORAGE_KEY) || "");
            timerPresets = {
                r1: presetList(parsed && parsed.r1) || DEFAULT_PRESETS.slice(),
                r2: presetList(parsed && parsed.r2) || DEFAULT_PRESETS.slice()
            };
        } catch (error) {
            timerPresets = {
                r1: DEFAULT_PRESETS.slice(),
                r2: DEFAULT_PRESETS.slice()
            };
        }
    }

    function presetLabel(seconds) {
        const total = Math.max(0, Math.round(seconds));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        if (hours > 0 && minutes > 0) return `${hours}h ${minutes}m`;
        if (hours > 0) return `${hours}h`;
        if (minutes > 0) return `${minutes}m`;
        return `${total}s`;
    }

    function renderPresetButtons() {
        for (const relay of DEVICES) {
            const box = document.getElementById(`presets-${relay}`);
            box.replaceChildren();
            for (const seconds of timerPresets[relay]) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "timer-btn";
                button.textContent = presetLabel(seconds);
                button.addEventListener("click", () => startPresetTimer(relay, seconds));
                box.appendChild(button);
            }
        }
    }

    function renderPresetEditors() {
        for (const relay of DEVICES) {
            const editor = document.getElementById(`preset-editor-${relay}`);
            const add = document.getElementById(`add-preset-${relay}`);
            editor.replaceChildren();
            timerPresets[relay].forEach((seconds, index) => {
                const row = document.createElement("div");
                row.className = "preset-edit";
                const input = document.createElement("input");
                input.type = "number";
                input.min = "1";
                input.max = String(MAX_PRESET_MINUTES);
                input.value = String(seconds / 60);
                input.setAttribute("aria-label", `${relay === "r1" ? "Lights" : "Ceiling fan"} shortcut ${index + 1} minutes`);
                input.addEventListener("change", () => editPreset(relay, index, input.value));
                const unit = document.createElement("span");
                unit.textContent = "min";
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "btn-quiet";
                remove.textContent = "Remove";
                remove.addEventListener("click", () => removePreset(relay, index));
                row.append(input, unit, remove);
                editor.appendChild(row);
            });
            if (add) add.disabled = timerPresets[relay].length >= MAX_PRESETS;
        }
    }

    function savePresets() {
        localStorage.setItem(PRESET_STORAGE_KEY, JSON.stringify(timerPresets));
        renderPresetButtons();
        renderPresetEditors();
    }

    function addPreset(relay) {
        if (!DEVICES.includes(relay) || timerPresets[relay].length >= MAX_PRESETS) return;
        timerPresets[relay].push(15 * 60);
        savePresets();
    }

    function editPreset(relay, index, minutes) {
        const value = Math.floor(Number(minutes));
        if (!Number.isFinite(value) || value < 1 || value > MAX_PRESET_MINUTES) {
            renderPresetEditors();
            return;
        }
        timerPresets[relay][index] = value * 60;
        savePresets();
    }

    function removePreset(relay, index) {
        timerPresets[relay].splice(index, 1);
        if (!timerPresets[relay].length) timerPresets[relay] = DEFAULT_PRESETS.slice();
        savePresets();
    }

    function resetPresets(relay) {
        if (!DEVICES.includes(relay)) return;
        timerPresets[relay] = DEFAULT_PRESETS.slice();
        savePresets();
    }

    let roomOpen = false;
    let viewState = { tab: "dash", map: "2d", roomOpen: false };

    function readView() {
        try {
            const parsed = JSON.parse(localStorage.getItem(VIEW_STORAGE_KEY) || "");
            if (!parsed || typeof parsed !== "object") return;
            if (parsed.tab === "dash" || parsed.tab === "map") viewState.tab = parsed.tab;
            if (parsed.map === "2d" || parsed.map === "3d") viewState.map = parsed.map;
            if (typeof parsed.roomOpen === "boolean") viewState.roomOpen = parsed.roomOpen;
        } catch (error) {
            viewState = { tab: "dash", map: "2d", roomOpen: false };
        }
    }

    function saveView() {
        viewState.roomOpen = roomOpen;
        localStorage.setItem(VIEW_STORAGE_KEY, JSON.stringify(viewState));
    }

    function log(message, type = "info") {
        const logBox = document.getElementById("logBox");
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        entry.innerText = `[${time}] ${message}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function feedUrl(path) {
        return `https://io.adafruit.com/api/v2/${USERNAME}/feeds/${FEED_KEY}${path}`;
    }

    function dataIdentity(data) {
        if (data.id != null) return String(data.id);
        return data.created_at || null;
    }

    function timerKey(relay) {
        return `t${relay.slice(1)}`;
    }

    function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function formatLeft(ms) {
        const total = Math.max(0, Math.ceil(ms / 1000));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        if (hours > 0) return `${hours}h ${String(minutes).padStart(2, "0")}m`;
        if (minutes <= 0) return `${seconds}s`;
        return `${minutes}m ${String(seconds).padStart(2, "0")}s`;
    }

    function requireAioKey() {
        if (AIO_KEY) return true;
        setOnlineStatus(false);
        if (!keyMissingLogged) {
            log("Paste your AIO key in Settings", "error");
            keyMissingLogged = true;
        }
        return false;
    }

    function saveAioKey() {
        AIO_KEY = document.getElementById("aioKeyInput").value.trim();
        localStorage.setItem(AIO_STORAGE_KEY, AIO_KEY);
        if (AIO_KEY) {
            keyMissingLogged = false;
            log("AIO key saved in this browser", "success");
            requestSnapshot();
            return;
        }
        keyMissingLogged = false;
        log("AIO key cleared", "error");
        setOnlineStatus(false);
    }

    async function postPayload(fields) {
        if (!requireAioKey()) return false;
        try {
            const response = await fetch(feedUrl("/data"), {
                method: "POST",
                headers: {
                    "X-AIO-Key": AIO_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ value: JSON.stringify(fields) })
            });

            if (response.ok) {
                log(`Sent: ${JSON.stringify(fields)}`, "success");
                setOnlineStatus(true);
                return true;
            }

            const err = await response.text();
            log(`HTTP ${response.status} Error: ${err}`, "error");
            setOnlineStatus(false);
        } catch (error) {
            log(`Network Error: ${error.message}`, "error");
            setOnlineStatus(false);
        }
        return false;
    }

    async function getLast() {
        if (!requireAioKey()) return null;
        try {
            const response = await fetch(feedUrl("/data/last"), {
                headers: { "X-AIO-Key": AIO_KEY }
            });

            if (!response.ok) {
                log(`Failed to fetch latest state: HTTP ${response.status}`, "error");
                setOnlineStatus(false);
                return null;
            }

            setOnlineStatus(true);
            const data = await response.json();
            if (!data || !data.value) return null;
            return data;
        } catch (error) {
            log(`Failed to reach Adafruit IO: ${error.message}`, "error");
            setOnlineStatus(false);
            return null;
        }
    }

    function applyRelayFields(parsed) {
        for (const key of RELAYS) {
            if (parsed[key] === 0 || parsed[key] === 1) {
                currentStates[key] = parsed[key];
            }
        }
    }

    function applyDeviceSnapshot(parsed, createdMs) {
        applyRelayFields(parsed);
        const ageSec = Number.isFinite(createdMs) ? (Date.now() - createdMs) / 1000 : 0;

        for (const key of RELAYS) {
            const published = parsed[timerKey(key)];
            if (typeof published !== "number") continue;
            const left = published - ageSec;
            if (parsed[key] === 0 || left <= 0.5) {
                deadlines[key] = 0;
            } else {
                deadlines[key] = Date.now() + left * 1000;
            }
        }

        if (settingsDirty || !Array.isArray(parsed.touch) || parsed.touch.length < 2) {
            return;
        }

        touchMap = parsed.touch.slice(0, 2).map((value) => {
            const relay = Number(value);
            return relay >= 1 && relay <= 2 ? relay : 0;
        });
        fillTouchSelects();
    }

    function showTab(tab) {
        const dash = tab !== "map";
        viewState.tab = dash ? "dash" : "map";
        document.getElementById("dashboardView").classList.toggle("hidden", !dash);
        document.getElementById("mapView").classList.toggle("hidden", dash);
        document.getElementById("tabDash").classList.toggle("active", dash);
        document.getElementById("tabMap").classList.toggle("active", !dash);
        saveView();
    }

    function showMapMode(mode) {
        const flat = mode !== "3d";
        viewState.map = flat ? "2d" : "3d";
        document.getElementById("map2d").classList.toggle("hidden", !flat);
        document.getElementById("map3d").classList.toggle("hidden", flat);
        document.getElementById("mode2d").classList.toggle("active", flat);
        document.getElementById("mode3d").classList.toggle("active", !flat);
        saveView();
    }

    function setRoomOpen(open) {
        roomOpen = Boolean(open);
        document.getElementById("roomCard").classList.toggle("open", roomOpen);
        document.getElementById("roomToggle").setAttribute("aria-expanded", roomOpen ? "true" : "false");
        saveView();
    }

    function toggleRoom() {
        setRoomOpen(!roomOpen);
    }

    function openSettings() {
        document.getElementById("aioKeyInput").value = AIO_KEY;
        document.getElementById("settingsSheet").classList.remove("hidden");
    }

    function closeSettings() {
        document.getElementById("settingsSheet").classList.add("hidden");
    }

    function fillTouchSelects() {
        fillingTouch = true;
        for (let i = 0; i < touchMap.length; i++) {
            const select = document.getElementById(`touch-map-${i}`);
            if (select) select.value = String(touchMap[i]);
        }
        fillingTouch = false;
    }

    function onTouchSelectChange() {
        if (fillingTouch) return;
        settingsDirty = true;
    }

    function saveTouchSettings() {
        const next = [];
        for (let i = 0; i < 2; i++) {
            const relay = Number(document.getElementById(`touch-map-${i}`).value);
            next.push(relay >= 1 && relay <= 2 ? relay : 0);
        }
        touchMap = next;
        settingsDirty = false;
        postPayload({ touch: next.concat([0, 0]) });
        log(`Touch map sent: ${JSON.stringify(next)}`);
    }

    function applyFeed(data) {
        const id = dataIdentity(data);
        if (id && id === lastAppliedId) return false;

        let parsed;
        try {
            parsed = JSON.parse(data.value);
        } catch (error) {
            log("Feed value is not JSON", "error");
            return false;
        }

        if (id) lastAppliedId = id;

        if (parsed.src === "d") {
            applyDeviceSnapshot(parsed, Date.parse(data.created_at));
            updateUI();
            refreshCountdownLabels();
            log(`Device snapshot: ${data.value}`, "success");
            return true;
        }

        applyRelayFields(parsed);
        updateUI();
        return false;
    }

    async function fetchCloudState() {
        const data = await getLast();
        if (data) applyFeed(data);
    }

    async function requestSnapshot() {
        if (!requireAioKey()) return;
        log("Requesting device snapshot...");
        const before = await getLast();
        const beforeId = before ? dataIdentity(before) : null;
        if (before) applyFeed(before);

        const posted = await postPayload({ q: 1 });
        if (!posted) return;

        for (let attempt = 0; attempt < 6; attempt++) {
            await delay(attempt === 0 ? 500 : 800);
            const data = await getLast();
            if (!data || dataIdentity(data) === beforeId) continue;

            let parsed;
            try {
                parsed = JSON.parse(data.value);
            } catch (error) {
                continue;
            }

            if (parsed.src === "d") {
                applyFeed(data);
                return;
            }
        }

        log("Snapshot not received yet. State will update on the next poll.", "error");
    }

    function toggleRelay(relay) {
        if (!DEVICES.includes(relay)) return;
        const next = currentStates[relay] === 1 ? 0 : 1;
        currentStates[relay] = next;
        deadlines[relay] = 0;
        updateUI();
        refreshCountdownLabels();

        const payload = {};
        payload[relay] = next;
        payload[timerKey(relay)] = 0;
        postPayload(payload);
    }

    function startTimer(relay, seconds) {
        if (!DEVICES.includes(relay)) return;
        seconds = Math.floor(Number(seconds));
        if (!Number.isFinite(seconds) || seconds < 1) {
            log(`Enter a timer between 1 and ${MAX_TIMER_SECONDS} seconds`, "error");
            return;
        }
        if (seconds > MAX_TIMER_SECONDS) seconds = MAX_TIMER_SECONDS;

        currentStates[relay] = 1;
        deadlines[relay] = Date.now() + seconds * 1000;
        updateUI();
        refreshCountdownLabels();

        const payload = {};
        payload[relay] = 1;
        payload[timerKey(relay)] = seconds;
        postPayload(payload);
        log(`Timer sent: ${relay} turns OFF in ${seconds}s`);
    }

    function startCustomTimer(relay) {
        const input = document.getElementById(`timer-input-${relay}`);
        startTimer(relay, input.value);
    }

    function startPresetTimer(relay, seconds) {
        startTimer(relay, seconds);
    }

    function cancelTimer(relay) {
        if (!DEVICES.includes(relay)) return;
        deadlines[relay] = 0;
        refreshCountdownLabels();
        const payload = {};
        payload[timerKey(relay)] = 0;
        postPayload(payload);
        log(`Timer cancelled: ${relay}`);
    }

    function refreshCountdownLabels() {
        const now = Date.now();
        let relaysChanged = false;

        for (const key of DEVICES) {
            const display = document.getElementById(`timer-display-${key}`);
            const deadline = deadlines[key];
            if (!deadline || deadline <= now) {
                if (deadline && deadline <= now) {
                    deadlines[key] = 0;
                    if (currentStates[key] !== 0) {
                        currentStates[key] = 0;
                        relaysChanged = true;
                    }
                }
                if (display) display.innerText = "";
            } else if (display) {
                display.innerText = formatLeft(deadline - now);
            }
        }

        if (relaysChanged) updateUI();
    }

    function updateUI() {
        const lightsOn = currentStates.r1 === 1;
        const fanOn = currentStates.r2 === 1;

        const row1 = document.getElementById("row-r1");
        const row2 = document.getElementById("row-r2");
        row1.classList.toggle("is-on", lightsOn);
        row2.classList.toggle("is-on", fanOn);
        row1.setAttribute("aria-pressed", lightsOn ? "true" : "false");
        row2.setAttribute("aria-pressed", fanOn ? "true" : "false");
        document.getElementById("state-r1").textContent = lightsOn ? "On" : "Off";
        document.getElementById("state-r2").textContent = fanOn ? "On" : "Off";

        document.getElementById("chip-lights").classList.toggle("is-on", lightsOn);
        document.getElementById("chip-fan").classList.toggle("is-on", fanOn);
        document.getElementById("chip-lights-text").textContent = lightsOn ? "1 on" : "0 on";
        document.getElementById("chip-fan-text").textContent = fanOn ? "On" : "Off";

        document.getElementById("icon-lights").classList.toggle("show", lightsOn);
        document.getElementById("icon-fan").classList.toggle("show", fanOn);

        const brief = lightsOn && fanOn
            ? "Lights and fan on"
            : lightsOn
                ? "Lights on"
                : fanOn
                    ? "Fan on"
                    : "All off";
        document.getElementById("roomBrief").textContent = brief;

        document.getElementById("map2d").classList.toggle("lit", lightsOn);
        document.getElementById("map3d").classList.toggle("lit", lightsOn);

        document.querySelectorAll("[data-light]").forEach((el) => {
            el.classList.toggle("is-on", lightsOn);
            if (el.tagName === "BUTTON") el.setAttribute("aria-pressed", lightsOn ? "true" : "false");
        });
        document.querySelectorAll("[data-fan]").forEach((el) => {
            el.classList.toggle("is-on", fanOn);
            if (el.tagName === "BUTTON") el.setAttribute("aria-pressed", fanOn ? "true" : "false");
        });
        document.querySelectorAll("[data-fan-rotor]").forEach((el) => {
            el.classList.toggle("spin", fanOn);
        });
    }

    function setOnlineStatus(online) {
        const badge = document.getElementById("statusBadge");
        const text = document.getElementById("statusText");
        const hint = document.getElementById("keyHint");
        if (online) {
            badge.className = "status-pill online";
            text.innerText = "Live";
        } else {
            badge.className = "status-pill";
            text.innerText = AIO_KEY ? "Offline" : "No key";
        }
        if (hint) hint.classList.toggle("hidden", Boolean(AIO_KEY));
    }

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSettings();
    });

    loadPresets();
    renderPresetButtons();
    renderPresetEditors();
    readView();
    roomOpen = viewState.roomOpen;
    showTab(viewState.tab);
    showMapMode(viewState.map);
    setRoomOpen(viewState.roomOpen);
    updateUI();
    setOnlineStatus(false);
    requestSnapshot();
    setInterval(fetchCloudState, 10000);
    setInterval(refreshCountdownLabels, 1000);
</script>
</body>
</html>
